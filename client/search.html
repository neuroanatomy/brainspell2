<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://npmcdn.com https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://cdn.rawgit.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="description"
    content="Open, collaborative platform for a human-curated classification of the neuroimaging literature">
  <meta name="keywords"
    content="Open science, Collaboration, Neuroimaging, Cognitive science, Neuroscience, Annotation, Meta-analysis">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <!-- Always force latest IE rendering engine (even in intranet) & Chrome Frame. -->
  <title>brainspell</title>
  <link rel="shortcut icon" type="image/x-icon" href="/img/favicon.ico">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" type="text/css" href="/css/theme.css">
  <link rel="stylesheet" type="text/css" href="/css/base.css">
  <link rel="stylesheet" type="text/css" href="/css/components.css">
  <link rel="stylesheet" type="text/css" href="/css/layout.css">
  <link rel="stylesheet" type="text/css" href="/css/theme-light.css">
  <script type="module" src="annotation/theme.js"></script>
  <link href="https://fonts.googleapis.com/css?family=Roboto:100" rel="stylesheet" type="text/css">
</head>

<body>

  <svg class="backdrop-svg" width="100%" height="100%" viewbox="0 0 400 400">
    <path d="M0,0h400,v400,h-400,v-400" class="backdrop-a"></path>
    <path d="M100,70h200,v200,h-200,v-200" class="backdrop-b"></path>
  </svg>

  <div class="page">
    <!-- Header (fixed height) -->
    <div class="page-top page-top-compact">
      <!-- Top-right menu bar -->
      <div id="menu">
        <a class="link-plain" href="/">
          <img id="small-logo" src="/img/brainspell.svg" />
        </a>
        <img id="doc" class="button" title="documentation" src="/img/doc.svg" />
        <a href="https://github.com/neuroanatomy/BrainBox/issues/new" target="_blank"><img id="bug" class="button"
            title="report a bug" src="/img/bug.svg" /></a>
        <a href="https://github.com/neuroanatomy" target="_blank"><img id="github" class="button icon-sm"
            title="join our github project" src="/img/github.svg" /></a>
        <a id="collections-link" href="collections.html" hidden>My collections</a>
        <div id="MyLogin">Login with GitHub</div>
      </div>
    </div>

    <!-- Content (variable height) -->
    <div class="page-main">
      <!-- Data -->
      <div id="data">
        <div id="content">
          <div id="article">
            <!-- Viewer -->
            <div id="viewer-container">
              <div id="viewer-info"></div>
              <div id="viewer"></div>
              <input type="range" id="level" /><span id="levelValue"></span><br />
            </div>

            <!-- Search -->
            <div class="search-box">
              <input id="url"
                type="text" placeholder="Search articles by title, author, keyword..." />
              <div class="search-count">
                <span id="num-articles"></span> articles indexed
              </div>
            </div>

            <!-- Data -->
            <div id="query-result">
              <span id="num-found"></span>
              <div id="selection-toolbar" class="col-toolbar" hidden></div>
              <ol id="paper-list"></ol>
            </div>
            <!-- End Data -->
          </div>
        </div>
      </div>
      <!-- End Data -->

    </div>
    <!-- End Content -->

    <!-- Space (fixed height) -->
    <div class="page-gap">
    </div>

    <!-- Footer (fixed height) -->
    <div class="site-footer">
      <p>
        <a target="_blank" href="http://neuroanatomy.github.io">
          <img src="img/naat-bw.svg" /></a>
        <a target="_blank" href="http://neuroanatomy.github.io" class="linkNoULine">
          groupe de neuroanatomie appliquée et théorique
        </a>
      </p>
    </div>
  </div>

  <!-- Authentication -->
  <script src="src/hello.polyfill.js"></script>
  <script src="src/hello.js"></script>
  <script src="src/modules/github.js"></script>
  <!--<script src="https://npmcdn.com/parse/dist/parse.js"></script>-->

  <!-- Parse -->
  <script src="https://npmcdn.com/parse@1.9.2/dist/parse.js"></script>

  <!-- Brainspell -->
  <script type="module" src="search.js"></script>


</body>

</html>
